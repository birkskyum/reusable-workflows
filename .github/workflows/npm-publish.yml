name: Publish to NPM

permissions:
  id-token: write  # Required for trusted publishing
  contents: write
  attestations: write

on:
  workflow_call:
    inputs:
      build-command:
        type: string
        default: npm ci && npm run build
        description: The command to build the project for release including packages installation
      checkout-submodules:
        type: string
        default: ''
        description: Whether to checkout submodules during build, `true` to checkout submodules or `recursive` to recursively checkout submodules
      publish-base-dir:
        type: string
        default: '.'
        description: The direction to run npm publish from
      docs-command:
        type: string
        default: npm run docs
        description: The command to build the documentation that will be uploaded to github pages
      docs-output-dir:
        type: string
        default: docs
        description: The folder where the docs are generated in order to upload them
      docs-gh-pages-dir:
        type: string
        default: ''
        description: The folder in github pages to publish the docs to
      branch:
        type: string
        default: main
        description: The branch to release from, use this to release patches of an older major version from a maintenance branch
      npm-tag:
        type: string
        default: ''
        description: The npm tag to publish regular releases under, set it when releasing from a maintenance branch so `latest` is not moved
      publish-docs:
        type: boolean
        default: true
        description: Whether to build and publish the docs to github pages

jobs:
  release-check:
    name: Check if version changed
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Use Node.js from nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Check if version has been updated
        id: check
        uses: EndBug/version-check@095362f3cd50f690c8fa0e6afeea81834bd8d320 # v3.0.0
          
    outputs:
      publish: ${{ steps.check.outputs.changed }}

  release:
    name: Release
    needs: release-check
    if: ${{ needs.release-check.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}
          submodules: ${{ inputs.checkout-submodules }}

      - name: Use Node.js from nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Get version
        id: package-version
        run: echo "current-version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ${{ inputs.build-command }}

      - name: Publish NPM package (regular)
        if: ${{ !contains(steps.package-version.outputs.current-version, '-') }}
        working-directory: ${{ inputs.publish-base-dir }}
        env:
          NPM_TAG: ${{ inputs.npm-tag }}
        run: npm publish --access=public ${NPM_TAG:+--tag "$NPM_TAG"}

      - name: Publish NPM package (pre-release)
        if: ${{ contains(steps.package-version.outputs.current-version, '-') }}
        working-directory: ${{ inputs.publish-base-dir }}
        run: npm publish --access=public --tag next

      - name: Tag commit and push
        id: tag_version
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.package-version.outputs.current-version }}
          release_branches: ${{ inputs.branch }}

      - name: Create Archive
        run: |
          zip -r dist dist

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist.zip

      - name: Build Release Notes
        id: release_notes
        env:
          VERSION: ${{ steps.package-version.outputs.current-version }}
        run: |
          RELEASE_NOTES_PATH="${PWD}/release_notes.txt"

          # Try exact match first (e.g., "## x.y.z")
          sed -n "/^## $VERSION$/,/^## /p" CHANGELOG.md | sed '$d' | tail -n +2 > "${RELEASE_NOTES_PATH}"

          # If nothing found, try match with brackets (e.g., "## [x.y.z]")
          if [ ! -s "${RELEASE_NOTES_PATH}" ]; then
            sed -n "/^## \[$VERSION\]/,/^## /p" CHANGELOG.md | sed '$d' | tail -n +2 > "${RELEASE_NOTES_PATH}"
          fi

          if [ ! -s "${RELEASE_NOTES_PATH}" ]; then
            echo "Warning: No content extracted to release notes for version $VERSION"
            exit 0
          fi

          echo "release_notes=${RELEASE_NOTES_PATH}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          bodyFile: ${{ steps.release_notes.outputs.release_notes }}
          artifacts: "dist.zip"
          artifactContentType: "application/zip"
          allowUpdates: false
          immutableCreate: true
          draft: false
          prerelease: ${{ contains(steps.package-version.outputs.current-version, '-') }}

      - name: Build the Docs
        if: ${{ inputs.publish-docs }}
        run: ${{ inputs.docs-command }}

      - name: Publish the docs
        if: ${{ inputs.publish-docs && !contains(steps.package-version.outputs.current-version, '-') }}
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ inputs.docs-output-dir }}
          destination_dir: ${{ inputs.docs-gh-pages-dir }}
          commit_message: 'deploy docs: ${{ steps.tag_version.outputs.new_tag }}'
